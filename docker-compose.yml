services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homework}
      POSTGRES_USER: ${POSTGRES_USER:-homework}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - homework-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homework} -d ${POSTGRES_DB:-homework}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homework}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-homework}?schema=public
    command: ["npm", "run", "db:push", "--workspace", "@homework/api"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-homework}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-homework}?schema=public
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      UPLOAD_DIR: /app/var/uploads
    volumes:
      - homework-uploads:/app/var/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  homework-postgres:
  homework-uploads:
